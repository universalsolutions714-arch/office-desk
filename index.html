<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Libre+Caslon+Text:wght@700&amp;display=swap">
<style>
/* Layout: a bound account register. A navy cloth band with index tabs on top, ruled ledger leaves below;
   money entries carry their date in the margin behind a red double rule, and figures sit in a right-hand
   column set like a bank passbook. One 760px column; every add/edit form opens in a bottom sheet. */
:root{
  --bg:#eceff4; --card:#ffffff; --ink:#16213a; --mut:#596479; --line:#d3d9e4; --soft:#e6eaf1; --rule2:#9aa6bb;
  --ac:#1f3d7a; --acink:#ffffff;
  --band:#15284d; --bandink:#f3f6fb; --bandmut:#aab7d0; --bandline:#2d4573; --brass:#d4ab52;
  --rule:#dd8b7e; --stamp:#5b3fa6;
  --good:#1c7a4f; --warn:#955f08; --bad:#b3321f;
  --bandok:#93dcb5; --bandwarn:#f2c772; --bandbad:#ffab9a;
  --shade:rgba(10,17,32,.5); --shadow:rgba(10,17,32,.2);
  --paper:#ffffff; --paperink:#1b1f27; --paperline:#c9d0dc; --papermut:#5c6472; --paperac:#1f3d7a; --paperstamp:#5b3fa6;
  --display:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --fig:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1322;--card:#151d2f;--ink:#e3e8f2;--mut:#98a3b8;--line:#2a354d;--soft:#1c263b;--rule2:#56627c;--ac:#92b1f1;--acink:#0a1431;--band:#17233d;--bandink:#eaeef8;--bandmut:#93a0bb;--bandline:#2e3d60;--brass:#dcb560;--rule:#a65a50;--stamp:#b7a0f2;--good:#62c696;--warn:#e4ab55;--bad:#f2917e;--bandok:#86d6aa;--bandwarn:#efc26d;--bandbad:#ffa391;--shade:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1322;--card:#151d2f;--ink:#e3e8f2;--mut:#98a3b8;--line:#2a354d;--soft:#1c263b;--rule2:#56627c;--ac:#92b1f1;--acink:#0a1431;--band:#17233d;--bandink:#eaeef8;--bandmut:#93a0bb;--bandline:#2e3d60;--brass:#dcb560;--rule:#a65a50;--stamp:#b7a0f2;--good:#62c696;--warn:#e4ab55;--bad:#f2917e;--bandok:#86d6aa;--bandwarn:#efc26d;--bandbad:#ffa391;--shade:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
table{font-size:inherit;color:inherit;line-height:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}

/* the register's cloth band */
.band{background:var(--band);color:var(--bandink)}
.band .wrap{padding-block:12px 11px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:30px}
.eyb{margin:0 auto 0 0;font:500 11.5px/1.3 var(--fig);letter-spacing:.04em;color:var(--bandmut);min-width:0;overflow-wrap:anywhere}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:70%;margin-left:auto}
.hbtns .btn{white-space:nowrap;background:transparent;color:var(--bandink);border-color:var(--bandline)}
.hbtns .btn:hover{border-color:var(--bandmut)}
.hbtns .btn.pri{background:var(--brass);border-color:var(--brass);color:var(--band)}
h1{font:700 23px/1.2 var(--display);margin:5px 0 0;color:var(--bandink);text-wrap:balance;overflow-wrap:anywhere}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:9px;font-size:12.5px;line-height:1.3;color:var(--bandmut)}
.fy{font:500 11.5px/1 var(--fig);color:var(--brass);border:1px solid currentColor;border-radius:3px;padding:4px 6px 3px;white-space:nowrap}
#ay{font-family:var(--fig);font-size:11.5px;white-space:nowrap}
#sync{display:inline-flex;align-items:center;gap:6px;color:var(--bandok);overflow-wrap:anywhere}
#sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
#sync.warn{color:var(--bandwarn)} #sync.bad{color:var(--bandbad)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);border-bottom:1px solid var(--bandline)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;padding-inline:7px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--bandmut);padding:10px 9px 8px;font:500 14px/1.2 var(--sans);cursor:pointer}
nav button:hover{color:var(--bandink)}
nav button[aria-current="page"]{color:var(--bandink);border-bottom-color:var(--brass);font-weight:600}
nav button:focus-visible{outline:2px solid var(--brass);outline-offset:-3px}

/* ledger leaves */
main .wrap{padding-block:16px 64px}
h2{font:700 17px/1.3 var(--display);margin:24px 0 9px;text-wrap:balance}
h2 .meta{font:400 13px/1.3 var(--sans);margin-left:2px}
h3{font:700 17px/1.3 var(--display);margin:0}
h4{font:600 11px/1.3 var(--sans);color:var(--mut);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.09em}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:8px}
.card.warnb{border-color:var(--warn)}
.card.badb{border-color:var(--bad);border-color:color-mix(in srgb,var(--bad) 62%,var(--line))}
.led{display:grid;grid-template-columns:46px minmax(0,1fr);padding:0}
.ld-d{display:flex;flex-direction:column;align-items:center;gap:1px;padding:13px 2px 10px;border-right:3px double var(--rule);font:500 10.5px/1.2 var(--fig);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.ld-d b{font:600 17px/1.1 var(--fig);letter-spacing:0;color:var(--ink)}
.ld-b{padding:12px 14px 12px 12px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:620px){.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px 11px;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.stat .sl{font:600 10.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.stat b{font:600 18px/1.25 var(--fig);letter-spacing:-.01em;padding-bottom:2px;border-bottom:3px double var(--rule2);max-width:100%;overflow-wrap:anywhere}
.stat .ss{font-size:12.5px;line-height:1.35;color:var(--mut)}
.stat.bad b{color:var(--bad)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.amt{flex:none;max-width:54%;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.fig{font-family:var(--fig);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt>.fig{font-size:15px;font-weight:600}
.ps{opacity:.55}
.drcr{font:600 10.5px/1 var(--sans);letter-spacing:.04em;color:var(--mut)}
.nil{font:500 13px/1.4 var(--fig);color:var(--good)}
.kind{display:block;font:600 10.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.msg{margin-top:8px;font-size:13px}
.msg summary{cursor:pointer;color:var(--ac);font-weight:500;width:max-content}
.msg p{margin:6px 0 0;padding:8px 10px;background:var(--soft);border-radius:6px;overflow-wrap:anywhere}
.sent{font-size:13px;color:var(--mut);margin:4px 0 0}
.meta{color:var(--mut);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;font:500 14px/1.2 var(--sans);text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:36px;cursor:pointer}
.btn:hover{border-color:var(--rule2)}
.btn.pri{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.del{color:var(--bad)}
.btn.sm{font-size:13px;padding:5px 10px;min-height:30px}
.btn:disabled{opacity:.55;cursor:default}
.lnk{all:unset;cursor:pointer;color:inherit;font-weight:600;overflow-wrap:anywhere}
.lnk:hover{text-decoration:underline}
.lnk:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:2px}
.tag{display:inline-block;font:600 11.5px/18px var(--sans);letter-spacing:.02em;border:1px solid currentColor;border-radius:3px;padding:0 6px;white-space:nowrap}
.stamp{display:inline-block;font:600 12px/1 var(--fig);letter-spacing:.2em;color:var(--stamp);border:3px double currentColor;border-radius:5px;padding:5px 5px 4px 8px;margin:2px 2px 0 0;transform:rotate(-6deg);white-space:nowrap}
.bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--good)}
.empty{color:var(--mut);border:1px dashed var(--rule2);border-radius:6px;padding:16px;text-align:center}
.note{background:var(--card);border:1px solid var(--warn);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.note .acts{margin-top:8px}
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.tbar input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font:500 13px/1.2 var(--sans);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--acink);border-color:var(--ac)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
#i_tx,#r_amt,#r_tds,#b_amt{font-family:var(--fig)}
textarea{resize:vertical}
select.inline{width:auto;font-size:14px;padding:6px 8px;min-height:36px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac)}
.ageing{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.ageing table{width:100%;border-collapse:collapse;min-width:300px}
.ageing caption{caption-side:top;text-align:left;padding:9px 12px 3px;font:600 10.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.ageing th{font:500 12px/1.3 var(--sans);color:var(--mut);text-align:right;padding:4px 8px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
.ageing td{font:500 13px/1.3 var(--fig);text-align:right;padding:7px 8px 9px;white-space:nowrap}
.ageing th:first-child,.ageing td:first-child{padding-left:12px}
.ageing th:last-child,.ageing td:last-child{padding-right:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.pnav b{text-align:center;flex:1}
.big{font:700 21px/1.25 var(--display)}
.dhead{margin:4px 0 8px}
.dhead h2{margin:0 0 3px;font-size:21px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--mut)} .kv dd{margin:0;overflow-wrap:anywhere}
.more{display:block;width:100%;margin-top:6px}
.auth{max-width:440px;margin:12px auto}
.auth h2{margin-top:0}

/* bottom sheet forms */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sh-back{position:absolute;inset:0;background:var(--shade)}
.sh-box{position:relative;background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;border-radius:12px 12px 0 0;box-shadow:0 -8px 30px var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:640px){.sheet{align-items:center}.sh-box{border-radius:12px;max-height:86vh}}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-head h3{font-size:18px}
.sh-body{overflow:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}
.x{font:inherit;font-size:22px;line-height:1;background:none;border:0;color:var(--mut);cursor:pointer;padding:4px 8px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.fld>span{font-size:13px;color:var(--mut);font-weight:600}
.fld small{color:var(--mut);font-size:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
@media(max-width:380px){.two{grid-template-columns:minmax(0,1fr)}}
.ferr{color:var(--bad);font-size:14px;margin:4px 0 8px;min-height:0}
.ferr:empty{display:none}
.sacts{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:6px}
.sum{background:var(--soft);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-variant-numeric:tabular-nums}
.calc{background:var(--soft);border-radius:6px;padding:8px 12px;margin:2px 0 10px;font-size:14px}
.calc div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:1px 0}
.calc div span:last-child{font-family:var(--fig);font-weight:500;font-variant-numeric:tabular-nums}
.calc .t{font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:5px}
.calc .t span:last-child{font-weight:600;border-bottom:3px double var(--rule2)}
.cklist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 10px;margin-bottom:8px}
.ck{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.ck:first-child{border-top:0}
.ck input{width:20px;height:20px;flex:none;accent-color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 20px var(--shadow)}

/* the printed invoice keeps white paper in both themes */
.qr{background:#fff;padding:6px;border-radius:4px;display:inline-block;line-height:0}
.inv{background:var(--paper);color:var(--paperink);border:1px solid var(--paperline);border-radius:4px;padding:18px;font-size:13px;line-height:1.45;margin-top:10px}
.inv .im{color:var(--papermut)}
.inv-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.inv-firm{font:700 18px/1.25 var(--display)}
.inv-title{font-weight:700;letter-spacing:.08em;font-size:13px;color:var(--paperac)}
.inv hr{border:0;border-top:1px solid var(--paperline);margin:12px 0}
.inv-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.inv-tw{overflow-x:auto;margin-top:12px}
.inv table{width:100%;border-collapse:collapse;min-width:280px;font-variant-numeric:tabular-nums}
.inv th,.inv td{text-align:left;padding:6px;border-bottom:1px solid var(--paperline);vertical-align:top}
.inv th{font-size:12px;color:var(--papermut)}
.inv .r{text-align:right}
.inv-tot{margin-left:auto;max-width:320px;margin-top:8px;font-variant-numeric:tabular-nums}
.inv-tot div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.inv-tot .t{font-weight:700;border-top:1px solid var(--paperline);padding-top:4px;margin-top:2px}
.inv-tot .t span:last-child{border-bottom:3px double var(--paperline)}
.inv-pay{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.inv-sign{text-align:right;margin-top:18px}
.pstamp{display:inline-flex;flex-direction:column;align-items:center;gap:4px;margin:6px 10px 6px auto;color:var(--paperstamp);border:3px double currentColor;border-radius:8px;padding:8px 12px 7px 16px;transform:rotate(-8deg);font:600 22px/1 var(--fig);letter-spacing:.24em}
.pstamp small{font:600 10.5px/1 var(--fig);letter-spacing:.06em}
@media (prefers-reduced-motion:no-preference){.sh-box{animation:up .18s ease-out}@keyframes up{from{transform:translateY(28px)}to{transform:none}}}
</style>

<header class="band">
  <div class="wrap">
    <div class="hrow" id="hrow">
      <p class="eyb" id="eyb" hidden></p>
      <div class="hbtns"><button class="btn sm pri" id="instb" data-a="install" hidden>Install app</button><button class="btn sm" id="setb" data-a="settings" hidden>Settings</button><button class="btn sm" id="outb" data-a="signout" hidden>Sign out</button></div>
    </div>
    <h1 id="firm">Office Desk</h1>
    <div class="hmeta"><span class="fy" id="fy">FY</span><span id="ay"></span><span id="sync" class="warn">Loading…</span></div>
  </div>
</header>
<nav aria-label="Sections"><div class="wrap" id="nav"></div></nav>
<main id="main"><div class="wrap"><div id="tool"></div><div id="list"></div></div></main>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sh-back" data-a="closeSheet"></div>
  <div class="sh-box"><div class="sh-head"><h3 id="shT"></h3><button class="x" type="button" data-a="closeSheet" aria-label="Close">×</button></div><div class="sh-body" id="shB"></div></div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
'use strict';
/* Firebase settings for the hosted phone app. Left null inside Claude, where Claude's own sync is used. */
var FBCFG = {"apiKey": "AIzaSyCF7Jyt8IXuAvtrkNVcKv_PQP7QVlc62Yc", "authDomain": "office-desk-c04ec.firebaseapp.com", "projectId": "office-desk-c04ec", "storageBucket": "office-desk-c04ec.firebasestorage.app", "messagingSenderId": "563966534066", "appId": "1:563966534066:web:08437ee33329afcb02c4ab"};
/* The firm's name: shown before sign-in, on staff phones (they cannot open the office settings) and until Settings has a name. */
var FIRM = '';

/* ================= helpers ================= */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid() { var a = new Uint8Array(10), s = '', i; try { crypto.getRandomValues(a); } catch (e) { for (i = 0; i < 10; i++) a[i] = Math.random() * 256 | 0; } for (i = 0; i < 10; i++) s += (a[i] % 36).toString(36); return s; }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function str(v, max) { return v == null ? '' : String(v).trim().slice(0, max || 500); }
function val(id) { var e = document.getElementById(id); return e ? String(e.value).trim() : ''; }
/* the firm's name: from Settings (owner), from the shared copy staff can read, or as last seen on this device */
var FIRMDOC = '~firm', SHAREDFIRM = '', CACHEDFIRM = str(lsGet('od_firm'), 120);
function brand() { return S.set.name || SHAREDFIRM || CACHEDFIRM || FIRM || 'Office Desk'; }
function firmSync() {
  var nm = S.set.name || SHAREDFIRM;
  if (nm && nm !== CACHEDFIRM) { CACHEDFIRM = nm; lsSet('od_firm', nm); }
  /* the owner keeps a copy of the name where staff phones can read it */
  if (MODE === 'db' && ROLE === 'admin' && LOADED.set && LOADED.staff && S.set.name && S.set.name !== SHAREDFIRM && !firmSync.busy && (firmSync.fails || 0) < 2) {
    var want = S.set.name; firmSync.busy = true;
    write(PATH.staff + '/' + FIRMDOC, 'set', { name: want }).then(function (ok) { firmSync.busy = false; if (ok) { SHAREDFIRM = want; firmSync.fails = 0; } else firmSync.fails = (firmSync.fails || 0) + 1; });

function savePayment(f, t, field) {
  var id = f.dataset.id, x = find(t, id); if (!x) return closeSheet();
  var info = t === 'pay' ? pinfo(x) : vinfo(x), a = r2(num(val('r_amt') || '0')), tds = r2(num(val('r_tds') || '0')), date = val('r_date');
  if (!(a >= 0) || isNaN(num(val('r_amt') || '0'))) return ferr('Enter the amount as a number, like 11800.', 'r_amt');
  if (!(tds >= 0) || isNaN(num(val('r_tds') || '0'))) return ferr('Enter TDS as a number, or 0.', 'r_tds');
  if (a + tds <= 0) return ferr('Enter the amount.', 'r_amt');
  if (r2(a + tds) > r2(info.bal + 1)) return ferr('That is more than the balance of ' + inr(info.bal) + '. Check the amount and TDS.', 'r_amt');
  if (!okDate(date)) return ferr('Choose the date.', 'r_date');
  if (date > today()) return ferr('The date cannot be in the future.', 'r_date');
  var rec = { id: uid(), amt: a, tds: tds, date: date, mode: val('r_mode'), ref: val('r_ref') }, o = Object.assign({}, x); o[field] = x[field].concat([rec]);
  put(t, o); closeSheet();
  var after = t === 'pay' ? pinfo(find('pay', id)) : vinfo(find('vp', id));
  toast(after.bal <= 0 ? 'Payment saved. Fully paid.' : 'Payment saved. Balance ' + inr(after.bal));
}
